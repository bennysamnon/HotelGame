<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מלון החלומות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eee2;--ink:#12263a;--card:#fffdf8;--acc:#16a1ab;--gold:#b8872a;--mute:#66758a;--line:#e2d9c4;--head:#12263a;--headink:#f6efe0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b29;--ink:#f1ece0;--card:#172a3d;--mute:#9bb0c2;--line:#27425c;--head:#0a1420;--acc:#2cc3cd;--gold:#e0b04f}}
:root[data-theme="dark"]{--bg:#0e1b29;--ink:#f1ece0;--card:#172a3d;--mute:#9bb0c2;--line:#27425c;--head:#0a1420;--acc:#2cc3cd;--gold:#e0b04f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--head);color:var(--headink);padding:10px 14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center}
header b{display:block;font-size:20px;font-weight:900}
header small{opacity:.7;font-size:12px}
main{flex:1;overflow-y:auto;padding:12px 12px 16px}
h2{margin:4px 2px 10px;font-size:20px;font-weight:900}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.card .em{font-size:30px;width:44px;text-align:center}
.card .tx{flex:1;min-width:0}
.card .tx b{font-size:16px}
.card .tx p{margin:2px 0 0;font-size:13px;color:var(--mute)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 12px;background:var(--acc);color:#fff;min-width:84px;cursor:pointer}
button:disabled{background:var(--line);color:var(--mute);cursor:default}
button.gold{background:var(--gold)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line)}
nav button{background:none;color:var(--mute);border-radius:0;padding:10px 2px;font-size:12px;min-width:0}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.bell{width:100%;font-size:18px;padding:16px;margin-bottom:12px;background:var(--gold)}
.feed{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:10px 12px;margin:4px 0 12px;font-size:14px;min-height:96px}
.feed div{padding:3px 0;color:var(--mute)}.feed div:first-child{color:var(--ink);font-weight:700}
.pool{height:56px;border-radius:14px;margin-bottom:12px;background:repeating-linear-gradient(100deg,#2cc3cd 0 18px,#5fd8de 18px 36px);display:flex;align-items:center;justify-content:center;font-size:26px;letter-spacing:6px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.room{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:24px;padding:0;min-width:0;color:var(--ink);position:relative}
.room.occ{background:var(--acc);border-color:var(--acc)}
.room.occ::after{content:"🔑";position:absolute;font-size:11px;top:2px;left:3px}
.stars{color:var(--gold);letter-spacing:2px}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:5}
#modal.on{display:flex}
#sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));text-align:center}
#sheet .big{font-size:64px}
#sheet p{color:var(--mute);margin:6px 0 14px}
#sheet button{width:100%;margin-top:8px}
.map{direction:ltr;display:grid;grid-template-columns:1fr 1.3fr 1fr;grid-template-areas:"pool tower attr" "pool lobby attr";gap:8px;padding:10px;border-radius:18px;background:linear-gradient(#bfe6f0,#e9e3d0 55%,#9fcf8c 55%,#8cc47a)}
.zone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px;padding:8px 4px;min-width:0;color:#12263a;font-size:24px;border:2px solid #fff9;line-height:1.3;word-break:break-all;text-align:center}
.zone small{font-size:12px;font-weight:900}
.zp{grid-area:pool;background:linear-gradient(#7fe0e6,#2cc3cd);min-height:260px}
.za{grid-area:attr;background:linear-gradient(#f6d58a,#e8b95a)}
.zt{grid-area:tower;background:#d7e0ea;gap:3px;padding:6px}
.zl{grid-area:lobby;background:#f2e3c4;min-height:84px}
.fl{display:flex;gap:4px}
.w{width:18px;height:12px;border-radius:2px;background:#8ea3b8;display:block}
.w.lit{background:#ffd75e}.w.no{background:transparent}
.hint{text-align:center;color:var(--mute);font-size:14px;margin:12px 0}
.fab{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:3;display:flex;flex-direction:column-reverse;gap:8px;align-items:center}
.fab button{min-width:0;width:50px;height:50px;border-radius:50%;padding:0;font-size:22px;box-shadow:0 3px 10px #0005}
.fab .fm{display:none;flex-direction:column;gap:8px}.fab .fm.on{display:flex}
.fab .fm button{background:var(--card);color:var(--ink)}
#panel{position:fixed;left:0;right:0;bottom:0;height:82%;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px #0006;transform:translateY(105%);transition:transform .25s;z-index:4;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
#panel.on{transform:none}
@media(prefers-reduced-motion:reduce){#panel{transition:none}}
#pc{overflow-y:auto;padding:4px 12px 16px;flex:1}
.ph{padding:10px 12px 0}.ph button{min-width:0;width:38px;height:38px;border-radius:50%;padding:0;background:var(--line);color:var(--ink)}
#wrap{position:relative}
#guest{position:absolute;left:50%;top:92%;transform:translate(-50%,-100%);transition:left 2.5s ease-in-out,top 2.5s ease-in-out;z-index:2;background:none;border:0;padding:0;min-width:0;display:flex;flex-direction:column;align-items:center;color:#12263a}
#bub{background:#fff;border-radius:12px;padding:6px 9px;font-size:12px;font-weight:700;max-width:130px;width:max-content;box-shadow:0 2px 8px #0004;margin-bottom:2px;line-height:1.35}
#gc{font-size:38px;filter:drop-shadow(0 2px 2px #0005)}
@media(prefers-reduced-motion:reduce){#guest{transition:none}}
</style>
<script>window.__err=function(t){if((window.__n=(window.__n||0)+1)>4)return;var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;background:#b00;color:#fff;font:12px monospace;padding:8px;direction:ltr;text-align:left;white-space:pre-wrap';d.textContent=t+'  (tap to close)';d.onclick=function(){d.remove()};(document.body||document.documentElement).appendChild(d)};window.onerror=function(m,s,l,c){window.__err('ERROR: '+m+' ('+l+':'+c+')');return false};window.addEventListener('unhandledrejection',function(e){window.__err('PROMISE: '+e.reason)});setTimeout(function(){if(!window.__ok)window.__err('Game did not finish starting (v3). Send Claude a screenshot of this.')},4000);</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>')</script>
</head>
<body>
<header>
<div><b id="m">0</b><small>💰 כסף</small></div>
<div><b id="i">0</b><small>לאורח הבא</small></div>
<div><b id="o">0/0</b><small>חדרים תפוסים</small></div>
<div id="hs" style="grid-column:1/-1;font-size:14px"></div></header>
<main id="main"><div id="wrap"><div id="mapbox"></div><button id="guest" data-guest aria-label="האורח"><span id="bub">שלום! נכנסתי למלון 🧳</span><span id="gc">🧐</span></button></div><p class="hint" id="hint"></p></main>
<div style="position:fixed;left:6px;bottom:2px;font:9px monospace;opacity:.4;color:#fff;z-index:5;pointer-events:none">v3</div>
<div class="fab" id="fab"></div>
<div id="panel"><div class="ph"><button data-x aria-label="סגירה">✕</button></div><div id="pc"></div></div>
<div id="modal"><div id="sheet"></div></div>
<script>
const F=[
{id:'rec',t:0,n:'דלפק קבלה',e:'🛎️',c:40,g:1.6,sp:1,d:'עובדים נוספים = צ׳ק־אין מהיר יותר'},
{id:'elev',t:0,n:'מעליות לכל הקומות',e:'🛗',c:120,g:1.7,ap:1,pg:.1,d:'אורחים מגיעים לחדרים מהר ויותר מרוצים'},
{id:'pool',t:1,n:'בריכה ענקית',e:'🏊',c:150,g:1.6,ap:2,pg:.2,d:'מושכת משפחות שלמות'},
{id:'slide',t:1,n:'מגלשות',e:'🛝',c:300,g:1.6,ap:2,d:'הילדים לא רוצים ללכת הביתה'},
{id:'sun',t:1,n:'מיטות שיזוף',e:'🏖️',c:200,g:1.6,pg:.4,d:'אורחים נשארים ומוציאים יותר'},
{id:'bar',t:1,n:'בר בריכה',e:'🍹',c:350,g:1.6,pg:.8,d:'קוקטיילים ליד המים'},
{id:'guard',t:1,n:'מצילים ועובדי בריכה',e:'🦺',c:250,g:1.6,ap:1,pg:.1,d:'בטיחות וניקיון מביאים עוד אורחים'},
{id:'vip',t:1,n:'אזור VIP',e:'💎',c:1200,g:1.7,pg:2.5,d:'קבאנות פרטיות לאורחים הכי חשובים'},
{id:'buf',t:3,n:'מסעדת בופה',e:'🍽️',c:400,g:1.6,pg:1,d:'כל אורח אוכל ארוחת בוקר'},
{id:'spa',t:3,n:'חדר כושר וספא',e:'🧖',c:700,g:1.65,ap:1,pg:1.5,d:'עיסויים וסאונה'},
{id:'hall',t:3,n:'אולם אירועים',e:'🎉',c:1500,g:1.7,pg:3,d:'חתונות, כנסים ובר מצוות'},
{id:'shop',t:3,n:'חנות מתנות',e:'🎁',c:300,g:1.6,pg:.7,d:'מגנטים ומגבות עם לוגו'},
{id:'rs',t:3,n:'שירות חדרים',e:'🍳',c:500,g:1.6,pg:1.2,d:'ארוחה עד הדלת'}];
const R=[
{id:'reg',n:'חדר רגיל',e:'🛏️',c:100,r:1,cap:2,d:'מיטה זוגית, מקלחת וחלון לגינה.'},
{id:'fam',n:'חדר משפחתי',e:'👨‍👩‍👧',c:350,r:3,cap:4,d:'שתי מיטות, ספה נפתחת ופינת משחקים.'},
{id:'lux',n:'סוויטה יוקרתית',e:'👑',c:1000,r:8,cap:2,d:'ג׳קוזי, מרפסת ונוף לים.'},
{id:'jr',n:'ג׳וניור סוויטה',e:'🛋️',c:1800,r:500,cap:3,s:2,d:'סלון קטן, מיטה גדולה ופינת קפה.'},
{id:'pent',n:'פנטהאוז',e:'🏙️',c:4000,r:900,cap:2,s:3,d:'קומה עליונה עם בריכה פרטית ונוף לעיר.'},
{id:'roy',n:'סוויטה מלכותית',e:'🏰',c:12000,r:2000,cap:4,s:4,d:'שירות אישי, בר פרטי ושתי מרפסות.'}];
const SC=[0,2000,8000,25000,80000],CAP=[8,16,28,42,60],MAXL=5;
const B={rec:[50,2,10],elev:[150,1.9,10],pool:[200,1.9,15],slide:[400,1.9,15],sun:[250,1.9,8],bar:[450,1.9,20],guard:[300,1.9,8],vip:[1500,1.9,40],buf:[500,1.9,20],spa:[900,1.9,30],hall:[2000,1.9,50],shop:[400,1.9,12],rs:[700,1.9,18]};
F.forEach(f=>{const b=B[f.id];f.c=b[0];f.g=b[1];f.pg=b[2];f.sp=0});
R[0].r=50;R[1].r=120;R[2].r=300;
const TABS=[['🛎️','לובי'],['🏊','בריכות'],['🛏️','חדרים'],['🍽️','אטרקציות']];
let S={m:100,s:1,f:{},r:{reg:1,fam:0,lux:0,jr:0,pent:0,roy:0},stays:[],occ:0},tab=-1,menu=false,feed=['ברוכים הבאים למלון! 🌴'],tipAt={};
try{const x=JSON.parse(localStorage.getItem('hotel2'));if(x&&x.r)S=x}catch(e){}
R.forEach(r=>{S.r[r.id]=S.r[r.id]||0});
const $=id=>document.getElementById(id);
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':Math.floor(n).toLocaleString('he');
const lv=id=>S.f[id]||0,fc=f=>Math.round(f.c*Math.pow(f.g,lv(f.id)));
const mult=()=>1+.25*(S.s-1),total=()=>R.reduce((a,r)=>a+S.r[r.id],0);
const rc=r=>Math.round(r.c*Math.pow(1.12,S.r[r.id]));
function calc(){let sp=1,ap=0,pg=0;F.forEach(f=>{const l=lv(f.id);sp+=(f.sp||0)*l;ap+=(f.ap||0)*l;pg+=(f.pg||0)*l});
const rooms=[];R.slice().reverse().forEach(r=>{for(let i=0;i<S.r[r.id];i++)rooms.push(r)});
return{sp,ap,pg,rooms,target:Math.min(rooms.length,2+ap+S.s*2)}}
function income(c){let ri=0,g=0;c.rooms.forEach((r,i)=>{const f=Math.max(0,Math.min(1,S.occ-i));ri+=r.r*f;g+=r.cap*f});return ri*mult()+g*c.pg*.5}
function say(t){feed.unshift(t);feed=feed.slice(0,5)}
function tick(){const c=calc(),old=Math.floor(S.occ);
if(S.occ<c.target)S.occ=Math.min(c.target,S.occ+c.sp*.4);else S.occ=Math.max(c.target,S.occ-.3);
const n=Math.floor(S.occ);if(n>old)say('אורח קיבל מפתח לחדר '+(100+n)+' 🔑');if(n<old)say('אורח עזב ושילם בקבלה 💳');
S.m+=income(c);if(++gt%9==0){gz=(gz+1)%4;guestSet(gz)}draw()}
function head(){const c=calc();$('hs').innerHTML='<span class="stars" style="color:#f0c24d;font-size:18px">'+'★'.repeat(S.s)+'☆'.repeat(5-S.s)+'</span> דירוג המלון: '+S.s+' כוכבים &nbsp; ⏱️ '+mm(S.t)+' · אורח נוסף בעוד '+mm(120-(S.t||0)%120);$('m').textContent=fmt(S.m);$('i').textContent=fmt(income(c));$('o').textContent=Math.floor(S.occ)+'/'+total()}
function fcard(f){const l=lv(f.id),c=fc(f),mx=l>=MAXL;
return `<div class="card"><div class="em">${f.e}</div><div class="tx"><b>${f.n}</b> <small class="stars">${'★'.repeat(l)+'☆'.repeat(MAXL-l)}</small><p>${f.d}<br>+₪${f.pg} לכל אורח, בכל כוכב</p></div><button data-f="${f.id}" ${mx||S.m<c?'disabled':''}>${mx?'מקסימום':(l?'שדרג':'קנה')+' ₪'+fmt(c)}</button></div>`}
function mapHTML(){const c=calc(),n=c.rooms.length,fl=Math.max(1,Math.ceil(n/4)),o=Math.floor(S.occ);
let t='';for(let f=fl-1;f>=0;f--){t+='<div class="fl">';for(let k=0;k<4;k++){const i=f*4+k;t+=`<i class="w ${i>=n?'no':i<o?'lit':''}"></i>`}t+='</div>'}
const ic=a=>a.filter(([id])=>lv(id)).map(x=>x[1]).join('')||'🚧';
const pool=ic([['pool','🏊'],['slide','🛝'],['sun','🏖️'],['bar','🍹'],['guard','🦺'],['vip','💎']]);
const att=ic([['buf','🍽️'],['spa','🧖'],['hall','🎉'],['shop','🎁'],['rs','🍳']]);
return `<div class="map"><button class="zone zp" data-t="1">${pool}<small>בריכות</small></button><button class="zone zt" data-t="2"><span class="stars">${'★'.repeat(S.s)}</span>${t}<small>חדרים ${o}/${n}</small></button><button class="zone zl" data-t="0"><span>${lv('elev')?'🛗 ':''}🚪${'🚶'.repeat(Math.min(4,Math.ceil(o/2)))}</span><small>לובי</small></button><button class="zone za" data-t="3">${att}<small>אטרקציות</small></button></div>`}
function draw(){head();
if(window.R3)upd3d();else $('mapbox').innerHTML=mapHTML();$('hint').textContent=feed[0];
$('fab').innerHTML=`<button data-menu aria-label="תפריט">${menu?'✕':'🗺️'}</button><div class="fm ${menu?'on':''}">${TABS.map((t,i)=>`<button data-t="${i}" aria-label="${t[1]}">${t[0]}</button>`).join('')}<button data-admin aria-label="אדמין">⚙️</button></div>`;
let h='';
if(tab==0){h=`<h2>לובי וקבלה</h2><button class="bell" data-bell>🛎️ משוך אורח</button><div class="feed">${feed.map(x=>`<div>${x}</div>`).join('')}</div>`+F.filter(f=>f.t==0).map(fcard).join('')}
if(tab==1){h=`<h2>מתחם בריכות</h2><div class="pool">${lv('pool')?'🏊 🛝 🍹 🏊':'🌊 🌊 🌊 🌊'}</div>`+F.filter(f=>f.t==1).map(fcard).join('')}
if(tab==2){const c=calc();h=`<h2>חדרים וסוויטות</h2><div class="card"><div class="em">⭐</div><div class="tx"><b>דירוג המלון</b> <span class="stars">${'★'.repeat(S.s)+'☆'.repeat(5-S.s)}</span><p>עד ${CAP[S.s-1]} חדרים · הכנסה ×${mult().toFixed(1)}</p></div><button class="gold" data-star ${S.s>=5||S.m<SC[S.s]?'disabled':''}>${S.s>=5?'5 כוכבים!':'שדרג ₪'+fmt(SC[S.s])}</button></div><div class="grid">${c.rooms.map((r,i)=>`<button class="room ${i<Math.floor(S.occ)?'occ':''}" data-room="${i}">${r.e}</button>`).join('')}</div>`+
R.map(r=>`<div class="card"><div class="em">${r.e}</div><div class="tx"><b>${r.n}</b> <small>×${S.r[r.id]}</small><p>₪${r.r} לכל אורח · ${r.cap} אורחים</p></div><button data-r="${r.id}" ${S.s<(r.s||1)||total()>=CAP[S.s-1]||S.m<rc(r)?'disabled':''}>${S.s<(r.s||1)?'🔒 כוכב '+r.s:total()>=CAP[S.s-1]?'המלון מלא':'בנה ₪'+fmt(rc(r))}</button></div>`).join('')}
if(tab==3){h=`<h2>מסעדות ואטרקציות</h2>`+F.filter(f=>f.t==3).map(fcard).join('')}
$('panel').classList.toggle('on',tab>=0);if(tab>=0){const sc=$('pc').scrollTop;$('pc').innerHTML=h;$('pc').scrollTop=sc}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if('admin' in d){adm?adminOpen():adminGate();return}
if('login' in d){if($('pin').value===ADMIN_PIN){adm=true;adminOpen()}else{$('perr').textContent='קוד שגוי'}return}
if(d.a){adminDo(d.a,b);return}
if('guest' in d){guestAsk();return}
if(d.t!==undefined){tab=+d.t;menu=false;draw();return}
if('menu' in d){menu=!menu;draw();return}
if('x' in d){tab=-1;draw();return}
if('bell' in d){const t=Date.now();if(t-lastPull>2000){lastPull=t;arrive(0)}draw();return}
if(d.f){const f=F.find(x=>x.id==d.f),c=fc(f);if(S.m>=c&&lv(f.id)<MAXL){S.m-=c;S.f[f.id]=lv(f.id)+1;say(f.e+' '+f.n+' שודרג!')}draw();return}
if(d.r){const r=R.find(x=>x.id==d.r),c=rc(r);if(S.m>=c&&total()<CAP[S.s-1]&&S.s>=(r.s||1)){S.m-=c;S.r[r.id]++;say(r.e+' נפתח '+r.n+' חדש')}draw();return}
